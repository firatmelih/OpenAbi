<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .label { fill: #1d1d1f; font-size: 15px; }
    .item { fill: #1d1d1f; font-size: 13.5px; }
    .muted { fill: #8a8a8e; font-size: 13.5px; }
    .menu { fill: #f6f5f4; stroke: rgba(0,0,0,0.12); }
    .sep { stroke: rgba(0,0,0,0.1); }
    .hl { fill: #d9342b; }
    .hl-text { fill: #ffffff; font-size: 13.5px; font-weight: 500; }
    .folder-back { fill: #6cb6f0; }
    .folder-front { fill: #8ccbf7; }
    .sel { fill: rgba(0,100,220,0.16); }
    .bg { fill: #fbf7f3; stroke: rgba(0,0,0,0.06); }
    @media (prefers-color-scheme: dark) {
      .label, .item { fill: #f2f2f7; }
      .muted { fill: #8e8e93; }
      .menu { fill: #2b2a2c; stroke: rgba(255,255,255,0.14); }
      .sep { stroke: rgba(255,255,255,0.12); }
      .sel { fill: rgba(80,150,255,0.25); }
      .bg { fill: #1c1b1d; stroke: rgba(255,255,255,0.08); }
    }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="719" height="469" rx="22"/>

  <!-- Selected folder in Finder -->
  <rect class="sel" x="38" y="96" width="176" height="170" rx="14"/>
  <path class="folder-back" d="M70 132 H120 Q130 132 136 140 L144 150 H182 Q194 150 194 162 V226 Q194 238 182 238 H70 Q58 238 58 226 V144 Q58 132 70 132 Z"/>
  <rect class="folder-front" x="58" y="160" width="136" height="78" rx="11"/>
  <text class="label" x="126" y="258" text-anchor="middle">my-project</text>

  <!-- Pointer -->
  <path d="M196 196 L196 222 L203 215 L208 227 L212 225 L207 213 L217 213 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Context menu -->
  <g filter="url(#shadow)">
    <rect class="menu" x="236" y="24" width="316" height="420" rx="12"/>
  </g>
  <g>
    <text class="item" x="258" y="54">Open</text>
    <text class="item" x="258" y="80">Open in New Tab</text>
    <text class="item" x="258" y="106">Open With</text>
    <text class="muted" x="530" y="106" text-anchor="end">›</text>
    <line class="sep" x1="250" y1="120" x2="538" y2="120"/>
    <text class="item" x="258" y="144">Get Info</text>
    <text class="item" x="258" y="170">Rename</text>
    <text class="item" x="258" y="196">Compress “my-project”</text>
    <text class="item" x="258" y="222">Duplicate</text>
    <line class="sep" x1="250" y1="236" x2="538" y2="236"/>
    <text class="item" x="258" y="260">Copy</text>
    <text class="item" x="258" y="286">Share…</text>
    <line class="sep" x1="250" y1="300" x2="538" y2="300"/>

    <!-- OpenAbi items -->
    <rect class="hl" x="244" y="306" width="300" height="28" rx="6"/>
    <rect x="256" y="311" width="18" height="18" rx="4.5" fill="#2f80ed" stroke="#fff" stroke-opacity="0.6"/>
    <text x="265" y="324" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="Menlo, monospace">&lt;/&gt;</text>
    <text class="hl-text" x="284" y="325">Open in Visual Studio Code</text>

    <rect x="256" y="341" width="18" height="18" rx="4.5" fill="#2c2c2e"/>
    <text x="265" y="354" text-anchor="middle" font-size="9" font-weight="700" fill="#5ef06e" font-family="Menlo, monospace">&gt;_</text>
    <text class="item" x="284" y="355">Open in Terminal</text>

    <rect x="256" y="371" width="18" height="18" rx="4.5" fill="#7d5bf0"/>
    <text x="265" y="384" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">✦</text>
    <text class="item" x="284" y="385">Open in Cursor</text>

    <line class="sep" x1="250" y1="400" x2="538" y2="400"/>
    <text class="item" x="258" y="424">Services</text>
    <text class="muted" x="530" y="424" text-anchor="end">›</text>
  </g>

  <!-- Callout -->
  <path d="M560 320 C 600 320, 612 300, 628 282" fill="none" stroke="#d9342b" stroke-width="2" stroke-dasharray="4 4"/>
  <text class="label" x="602" y="246" font-size="14" font-weight="600">Added by</text>
  <text x="602" y="266" font-size="14" font-weight="700" fill="#d9342b">OpenAbi</text>
</svg>
